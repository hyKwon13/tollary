name: Publish tollary with npm trusted publishing

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type the exact package version, for example "publish tollary@0.2.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.6.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Bind manual approval to the package manifest
        run: |
          EXPECTED_VERSION="$(node -p "require('./packages/tollary/package.json').version")"
          test "$CONFIRMATION" = "publish tollary@$EXPECTED_VERSION"
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
      - run: node scripts/validate-public-source.js
      - run: node scripts/validate-npm-publish-context.js --mode trusted
      - run: npm test
        working-directory: packages/tollary
      - run: npm pack --dry-run --ignore-scripts
        working-directory: packages/tollary
      - name: Publish through short-lived npm OIDC identity
        run: npm publish --access public --ignore-scripts
        working-directory: packages/tollary
