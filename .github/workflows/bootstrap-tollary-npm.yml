name: Bootstrap tollary npm package

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "publish tollary@0.1.0 testnet client only"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.confirmation == 'publish tollary@0.1.0 testnet client only' }}
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.6.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node scripts/validate-public-source.js
      - run: node scripts/validate-npm-publish-context.js --mode bootstrap
      - run: npm test
        working-directory: packages/tollary
      - run: npm pack --dry-run --ignore-scripts
        working-directory: packages/tollary
      - name: Publish first immutable public beta with provenance
        run: npm publish --access public --tag beta --provenance --ignore-scripts
        working-directory: packages/tollary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
